name: invoix-panel

services:
  prepare:
    image: alpine:3.21
    restart: "no"
    volumes:
      - /var/lib/invoix:/var/lib/invoix
    command:
      - sh
      - -c
      - mkdir -p /var/lib/invoix/tenants /var/lib/invoix/caddy && [ -f /var/lib/invoix/caddy/tenants.caddy ] || echo "# Generado por el panel." > /var/lib/invoix/caddy/tenants.caddy

  caddy:
    image: caddy:2
    container_name: invoix-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-invoix.co}
      ACME_EMAIL: ${ACME_EMAIL:-ops@invoix.co}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/invoix/caddy:/etc/caddy/sites
      - caddy_data:/data
      - caddy_config:/config
    networks: [invoix]
    depends_on:
      prepare:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4
    container_name: invoix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: panel
      MYSQL_USER: panel
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [invoix]

  redis:
    image: redis:7-alpine
    container_name: invoix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [invoix]

  panel:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    image: invoix-panel
    container_name: invoix-panel
    restart: unless-stopped
    env_file: .env
    environment: &app
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://panel.${PANEL_DOMAIN:-invoix.co}
      APP_TIMEZONE: America/Bogota
      APP_LOCALE: es
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: panel
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_CACHE_DB: "0"
      REDIS_PREFIX: panel-
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: database
      PANEL_DOMAIN: ${PANEL_DOMAIN:-invoix.co}
      TENANT_DATA_ROOT: /var/lib/invoix/tenants
      TENANT_HOST_ROOT: /var/lib/invoix/tenants
      INVOIX_NETWORK: invoix
      TENANT_DB_HOST: mysql
      TENANT_REDIS_HOST: redis
      CADDY_CONTAINER: invoix-caddy
      CADDY_HOST: caddy
      CADDY_SITES_PATH: /var/lib/invoix/caddy/tenants.caddy
      CADDY_TLS: on_demand
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      TENANT_HEALTH_MODE: public
      TENANT_HEALTH_TIMEOUT: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/invoix:/var/lib/invoix
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [invoix]

  horizon:
    image: invoix-panel
    container_name: invoix-horizon
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    env_file: .env
    environment: *app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/invoix:/var/lib/invoix
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [invoix]

  scheduler:
    image: invoix-panel
    container_name: invoix-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment: *app
    volumes:
      - /var/lib/invoix:/var/lib/invoix
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [invoix]

networks:
  invoix:
    name: invoix

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
